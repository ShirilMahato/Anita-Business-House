<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anita Business House</title>
  </head>
  <style>
    html {
      height: 100%;
    }
    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size:16px  
    }
      h1 {
          font-size: 40px; 
      }
      
      #particles-js {
          position: absolute;
          height: 100vh;
          z-index: -1;
          width: 100%;
      }
      .thank-you-container {
          margin: 0 auto;
          max-width: 700px;
          padding: 0 4em;
      }
      .thank-you-box {
          background: #fff;
          color: #000;
          padding: 1em 0.5em;
          border-radius: 5px;
          text-align: center;
          box-shadow: 1px 1px 3px rgba(105, 105, 105, 0.7);
      }
      .return-black {
         margin: 20px 0;
         text-align: center;
         width: 100%;
         float: left;
        color: black;
      }
      p{
        font-size: 25px;
        margin: 10px;
        margin-left: 40px;
        margin-right: 40px;
      }

      @media screen and (max-width:768px) {
        h1{
          font-size: 30px;
        }
        p{
          font-size: 18px;
        }
      }
</style>
<link rel="stylesheet" href="style.css">
  <body>
    <div id="particles-js"></div>
    <script src="http://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <div class="thank-you-container">
      <div class="thank-you-box">
        <div class="title">

          <h1>Thank you!</h1>
        </div>
        <p class="lead" style="margin-top: 5px; margin-bottom:10px ">for contacting us</p>
        <p>
          Our team will get back to you within 24 hours
        </p>
        <p class="signature" style="color:#1d4668; margin: top 10px; font-weight:bold; margin-bottom:40px;">Anita Business House</p>
        <!-- <p>Allison Skinner Web Design and Development</p> -->
      </div>
      <a class="return-black" href="index.html"
        >Return to Website</a
      >
    </div>


    <script>
      particlesJS('particles-js',
  
  {
    "particles": {
      "number": {
        "value": 80,

        }

      }
    },
    "retina_detect": true
  }
  
  );
  </script>
  </body>
</html>
